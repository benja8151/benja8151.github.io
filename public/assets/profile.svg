<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="Profile photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161c27"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="45%">
      <stop offset="0" stop-color="#2f9c8f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f9c8f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#halo)"/>
  <!-- simple avatar silhouette -->
  <circle cx="400" cy="380" r="150" fill="#2a3444"/>
  <path d="M180 900c0-150 98-250 220-250s220 100 220 250z" fill="#2a3444"/>
  <text x="400" y="960" font-family="monospace" font-size="30" fill="#7c8798" text-anchor="middle">profile.svg — swap in public/assets</text>
</svg>
